<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily News Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0A0C16">
<style>
:root, [data-theme=dark]{
  --bg:#0A0C16; --panel:#111426; --panel2:#16192D; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#F5F5F7; --soft:#A2A7BA; --faint:#7A8095;
  --accent:#8B7FF5; --accent-ink:#0A0C16; --accent-soft:rgba(139,127,245,.16);
  --green:#4CC38A; --amber:#E7B04B; --red:#F07474;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
[data-theme=light]{
  --bg:#F5F5F8; --panel:#FFFFFF; --panel2:#F0F0F5; --line:rgba(20,22,43,.09); --line2:rgba(20,22,43,.16);
  --ink:#15172B; --soft:#555B70; --faint:#6E7489;
  --accent:#5446D0; --accent-ink:#FFFFFF; --accent-soft:rgba(84,70,208,.10);
  --green:#1C8A57; --amber:#A86A00; --red:#C43D3D;
  --shadow:0 12px 36px rgba(20,22,43,.14);
}
:root{
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --side:236px;
  color-scheme:dark;
}
[data-theme=light]{ color-scheme:light }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:0 0 auto}
.logo svg{width:16px;height:16px}
.brand b{font-size:.78rem;letter-spacing:.08em;font-weight:600}
.nav-h{font-size:.7rem;letter-spacing:.08em;color:var(--faint);margin:14px 10px 6px;font-weight:600}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--soft);text-decoration:none;font-size:.9rem;text-align:left;min-height:38px}
.nav a:hover,.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav [aria-current=page]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.nav .n{margin-left:auto;font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);margin:0 6px 0 6px;flex:0 0 auto}
.nav [aria-current=page] .dot{background:var(--accent)}
.more-topics{display:none} .more-topics.open{display:block}
.side select{width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;margin:2px 0 0}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
body.collapsed{--side:68px}
body.collapsed .side .lbl, body.collapsed .side .nav-h, body.collapsed .side .n, body.collapsed .side select, body.collapsed .brand b,
body.collapsed .side .topics, body.collapsed .side .local{display:none}
body.collapsed .nav a, body.collapsed .nav button{justify-content:center}

/* ---------- Main + header ---------- */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 24px 10px;display:flex;align-items:center;gap:12px}
.top .menu{display:none}
.datectl{display:flex;align-items:center;gap:6px;margin:0 auto}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--soft)}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.iconbtn:disabled{opacity:.3;cursor:not-allowed}
.datebtn{padding:6px 14px;border-radius:10px;text-align:center;min-width:250px}
.datebtn:hover{background:var(--panel2)}
.datebtn .d{display:block;font-family:var(--serif);font-weight:650;font-size:1.22rem;line-height:1.2}
.datebtn .s{display:block;font-size:.76rem;color:var(--soft);margin-top:1px}
.live{color:var(--green)}
.datebtn .short{display:none}
@media(max-width:767px){ .datebtn .full{display:none} .datebtn .short{display:inline} }
.acts{display:flex;align-items:center;gap:4px}
.todaybtn{border:1px solid var(--line2);border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:500;min-height:34px}
.todaybtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
kbd{font-family:var(--sans);font-size:.7rem;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--faint);margin-left:4px}

/* Date popover */
.pop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:330px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:50}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--soft);min-height:34px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-weight:600;font-size:.95rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:.7rem;color:var(--faint);padding:4px 0}
.cal button{height:38px;border-radius:8px;font-size:.88rem;position:relative;font-variant-numeric:tabular-nums}
.cal button:hover:not(:disabled){background:var(--panel2)}
.cal button:disabled{color:var(--faint);opacity:.4;cursor:not-allowed}
.cal button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal button.today:not(.sel){box-shadow:inset 0 0 0 1px var(--line2)}
.cal button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal button.sel.has::after{background:var(--accent-ink)}
.cal-note{font-size:.74rem;color:var(--faint);margin:8px 0 0}

/* ---------- Content ---------- */
.content{max-width:1080px;margin:0 auto;padding:22px 24px 80px}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.page-h h1{font-family:var(--serif);font-weight:650;font-size:1.7rem;margin:0;line-height:1.15}
.page-h .sub{color:var(--soft);font-size:.9rem}
.sec{margin:0 0 28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.sec-h h2{font-size:.78rem;letter-spacing:.08em;font-weight:600;color:var(--soft);margin:0;text-transform:uppercase}
.sec-h .link{font-size:.84rem;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* Landing */
.landing{max-width:520px;margin:9vh auto 0;text-align:center}
.landing .kick{font-size:.78rem;letter-spacing:.14em;color:var(--soft);font-weight:600}
.landing h1{font-family:var(--serif);font-weight:650;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:8px 0 10px}
.landing p{color:var(--soft);margin:0 0 22px}
.btn{min-height:44px;padding:0 20px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec2{border:1px solid var(--line2)}
.landing .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.landing .prev{margin-top:30px}
.landing .prev h2{font-size:.78rem;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:0 0 8px}

/* Progress */
.build{padding:16px 18px;margin:0 0 22px}
.build h2{font-size:.78rem;letter-spacing:.1em;font-weight:600;margin:0 0 10px;color:var(--soft)}
.build ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:.86rem}
.build li{display:flex;align-items:center;gap:8px;color:var(--soft)}
.build li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2)}
.build li[data-s=ok]{color:var(--ink)} .build li[data-s=ok]::before{background:var(--green)}
.build li[data-s=wait]::before{animation:pulse 1s infinite alternate}
.build li[data-s=fail]::before{background:var(--red)}
.build .count{margin:12px 0 0;font-size:.9rem}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.warn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:0 0 20px;border-left:3px solid var(--amber)}
.warn p{margin:0;flex:1 1 220px;font-size:.9rem}

/* Briefing */
.brief{padding:20px 22px}
.brief .when{font-size:.78rem;letter-spacing:.1em;color:var(--accent);font-weight:600;text-transform:uppercase}
.brief h2{font-family:var(--serif);font-weight:650;font-size:1.45rem;margin:4px 0 12px;line-height:1.2}
.brief ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.brief li button{display:grid;grid-template-columns:110px 1fr;gap:12px;width:100%;text-align:left;padding:8px 8px;border-radius:8px;align-items:baseline}
.brief li button:hover{background:var(--panel2)}
.brief .area{font-size:.76rem;letter-spacing:.06em;color:var(--soft);font-weight:600;text-transform:uppercase}
.brief .t{font-family:var(--serif);font-size:1.04rem;line-height:1.35}
.brief .note{font-size:.76rem;color:var(--faint);margin:10px 8px 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px}
.kpi b{display:block;font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--soft)}
.kpi-note{font-size:.8rem;color:var(--faint);margin:8px 2px 0}

/* Top stories */
.tops{display:grid;grid-template-columns:1.35fr 1fr;gap:0}
.tops .lead{padding:20px 22px;border-right:1px solid var(--line);text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
.tops .lead .k{font-size:.72rem;letter-spacing:.1em;color:var(--accent);font-weight:600}
.tops .lead h3{font-family:var(--serif);font-weight:650;font-size:1.55rem;line-height:1.2;margin:8px 0 10px}
.tops .rest{display:flex;flex-direction:column}
.tops .rest button{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);display:block;width:100%}
.tops .rest button:last-child{border-bottom:0}
.tops .rest h4{font-family:var(--serif);font-weight:500;font-size:1.02rem;line-height:1.3;margin:0 0 4px}
.tops button:hover h3,.tops button:hover h4{text-decoration:underline;text-underline-offset:3px}
.meta{font-size:.8rem;color:var(--soft);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.meta .src{color:var(--ink);font-weight:500}
.cov{display:inline-flex;align-items:center;gap:5px}
.cov i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.c1{color:var(--faint)} .c2{color:var(--soft)} .c5{color:var(--green)} .c10{color:var(--accent)}

/* Topics overview */
.topics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.topic{padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.topic .th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;text-align:left}
.topic .th b{font-size:.78rem;letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.topic .th span{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.topic ul{list-style:none;margin:8px 0 6px;padding:0;flex:1}
.topic li button{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:.95rem;line-height:1.3;padding:5px 0;border-top:1px solid var(--line)}
.topic li:first-child button{border-top:0}
.topic li button:hover{color:var(--accent)}
.topic .all{font-size:.8rem;color:var(--accent);text-align:left;margin-top:auto;padding-top:4px;min-height:28px}
.topic-more{margin-top:10px}

/* What happened */
.wh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wh .card{padding:14px 16px}
.wh h3{font-size:.8rem;font-weight:600;margin:0 0 6px;color:var(--soft)}
.wh ul{list-style:none;margin:0;padding:0}
.wh li button{display:block;text-align:left;width:100%;font-family:var(--serif);font-size:.95rem;line-height:1.3;padding:6px 0;border-top:1px solid var(--line)}
.wh li:first-child button{border-top:0}
.wh li button:hover{color:var(--accent)}
.wh small{display:block;font-family:var(--sans);font-size:.75rem;color:var(--faint);margin-top:2px}

/* Feed rows */
.catbar{position:sticky;top:61px;z-index:20;background:var(--bg);padding:8px 0;margin:0 0 6px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{flex:0 0 auto}
.catbar .chip span{opacity:.7;margin-left:4px;font-size:.76rem}
.toolrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{padding:0 12px;min-height:34px;font-size:.84rem;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink);font-weight:500}
.feed{list-style:none;margin:0;padding:0}
.srow{display:grid;grid-template-columns:78px 1fr 20px;gap:14px;align-items:start;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.srow:hover{background:var(--panel)}
.srow .tm{font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums;padding-top:3px}
.srow .tm em{display:block;font-style:normal;font-size:.68rem;letter-spacing:.07em;color:var(--accent);font-weight:600;text-transform:uppercase;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .hl{display:block;font-family:var(--serif);font-weight:500;font-size:1.08rem;line-height:1.32;margin:0 0 5px;overflow-wrap:anywhere}
.srow .chev{color:var(--faint);padding-top:4px}
.showmore{display:block;margin:16px auto 0}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}
.empty b{display:block;font-family:var(--serif);font-size:1.25rem;font-weight:500;color:var(--ink);margin-bottom:6px}

/* Timeline */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:1px solid var(--line2)}
.tl h3{font-size:.8rem;letter-spacing:.08em;color:var(--accent);font-weight:600;margin:22px 0 4px;position:relative}
.tl h3::before{content:"";position:absolute;left:-27px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl h3:first-child{margin-top:0}
.tl .srow{grid-template-columns:62px 1fr 20px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line2);z-index:61;
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px 20px}
.drawer-b{overflow-y:auto;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px))}
.drawer h2{font-family:var(--serif);font-weight:650;font-size:1.4rem;line-height:1.25;margin:4px 0 14px}
.facts{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:0 0 16px;font-size:.88rem}
.facts dt{color:var(--soft)} .facts dd{margin:0}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.dact .btn{min-height:40px;padding:0 14px;font-size:.88rem}
.drawer h3{font-size:.76rem;letter-spacing:.08em;color:var(--soft);font-weight:600;margin:18px 0 6px;text-transform:uppercase}
.covlist{list-style:none;margin:0;padding:0}
.covlist li{padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
.covlist a{font-weight:500}
.covlist .tt{display:block;color:var(--soft);font-family:var(--serif);font-size:.95rem;margin-top:2px}
.wire{font-size:.8rem;color:var(--amber);margin:4px 0 0}
@media(prefers-reduced-motion:no-preference){
  .drawer{animation:slideR .22s ease} @keyframes slideR{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  .pop,.cmd{animation:fade .15s ease} @keyframes fade{from{opacity:0}to{opacity:1}}
}

/* Command search */
.cmdwrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding:10vh 12px 12px}
.cmd{width:620px;max-width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.cmd .in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmd input{flex:1;background:none;border:0;outline:0;font-size:1.05rem;min-height:36px}
.cmd .res{overflow-y:auto;padding:6px}
.cmd .res button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.cmd .res button:hover,.cmd .res button.on{background:var(--panel2)}
.cmd .res b{display:block;font-family:var(--serif);font-weight:500;font-size:1rem;line-height:1.3}
.cmd .hint{padding:14px 16px;color:var(--soft);font-size:.88rem}
.cmd .hint .chip{margin:6px 6px 0 0}


/* News activity */
.act{padding:10px 14px 8px;margin-top:10px}
.act-h,.act-x{display:flex;justify-content:space-between;font-size:.76rem;color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:2px;height:44px;margin:6px 0 4px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85;min-height:2px}
.bars i.z{background:var(--line2);opacity:1}
.act-x span{font-size:.68rem;color:var(--faint)}
/* Watchlist */
.wls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.wl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wl-h{display:flex;align-items:center;gap:8px}
.wl-h b{font-size:.9rem} .wl-h .kpi-note{flex:1}
.wl ul{list-style:none;margin:4px 0 0;padding:0}
.wl li button{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:.93rem;line-height:1.3;padding:6px 0;border-top:1px solid var(--line)}
.wl li button:hover{color:var(--accent)}
.wl small{display:block;font-family:var(--sans);font-size:.74rem;color:var(--faint);margin-top:2px}
.wl .link{font-size:.8rem;color:var(--accent);margin-top:4px;min-height:28px}
.wl-add{display:flex;gap:8px;max-width:420px}
.wl-add input{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);padding:0 12px}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.filters select{min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);padding:0 8px;max-width:100%;font-size:.86rem}
/* Update pill: fixed, so nothing on the page moves */
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;

/* ================= daily-pack storage (IndexedDB, localStorage fallback) =================
   Daily news packs (the heavy data: hundreds of reports per day) live here instead of
   localStorage, which caps around 5-10 MB total and made the old code evict old days
   at just 12 entries. IndexedDB quota is typically hundreds of MB, so this keeps far
   more history and never competes with saved-stories/settings for the same small budget.
   If IndexedDB is unavailable (older browser, private-mode restrictions), everything
   below transparently falls back to the original localStorage scheme so the app still
   works exactly as before. */
const PACKS_MAX = 90;                      // days kept before oldest are evicted
const packs = (function(){
  let db = null, idbFailed = !("indexedDB" in window);
  const index = [];                        // in-memory list of cached keys, newest first — avoids sync IDB reads during render
  function open(){
    if(idbFailed) return Promise.resolve(null);
    if(db) return Promise.resolve(db);
    return new Promise(res => {
      let req;
      try{ req = indexedDB.open("newsintel", 1); }catch(e){ idbFailed = true; res(null); return; }

// Browsers block reading another site directly, so feeds come through relays. Routes are tried ONE AT A TIME:
// the last route that worked goes first, a route that answers "slow down" (HTTP 429) rests with growing

// CapacitorHttp, or with your own relay set in Connection settings, the first route simply works.
const ROUTES = [
  { id:"custom",     make: u => (store.get("news:relay") || "") + encodeURIComponent(u), timeout:8000, when: () => !!store.get("news:relay") },
  { id:"direct",     make: u => u, timeout:2500 },
  { id:"script",     jsonp:true, make: (u, cb) => "https://api.allorigins.win/get?url=" + encodeURIComponent(u) + "&callback=" + cb, timeout:7000 },
  { id:"rss2json",   make: u => "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u), timeout:6000 },
  { id:"allorigins", make: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), timeout:6000 },
  { id:"codetabs",   make: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u), timeout:6000 },
  { id:"corsproxy",  make: u => "https://corsproxy.io/?url=" + encodeURIComponent(u), timeout:6000 },

    .sort((a, b) => ((health[b.id]||{}).ok||0) - ((health[a.id]||{}).ok||0));   // most recently successful first
}

function jsonp(src, ms, signal){

    const done = (fn, v) => { clearTimeout(t); delete window[cb]; s.remove(); signal.removeEventListener("abort", onAbort); fn(v); };
    const onAbort = () => done(reject, new Error("cancelled"));
    const t = setTimeout(() => done(reject, new Error("timed out")), ms);
    window[cb] = data => done(resolve, data);

    const data = await jsonp(cb => r.make(url, cb), r.timeout, signal);
    const code = data && data.status && data.status.http_code;
    if(code===429) throw Object.assign(new Error("rate limited"), { code:"rate" });
    const txt = data && typeof data.contents==="string" ? data.contents : "";

    throw new Error("unexpected reply");

    const res = await fetch(r.make(url), { signal: ctrl.signal });
    if(res.status===429) throw Object.assign(new Error("rate limited"), { code:"rate", retryAfter: +res.headers.get("retry-after") || 0 });
    if(!res.ok) throw new Error("HTTP "+res.status);

async function fetchFeed(url, signal){
  let sawRate = false;

    const order = routeOrder();
    for(const r of order){
      if(signal.aborted) throw new Error("cancelled");
      try{
        const res = await tryRoute(r, url, signal);
        health[r.id] = { ok: Date.now(), fails:0, until:0, strikes:0 }; saveHealth();
        return res;
      }catch(e){
        if(signal.aborted) throw e;
        const h = health[r.id] = health[r.id] || { ok:0, fails:0, until:0, strikes:0 };
        if(e.code==="rate"){                       // back off exponentially: 30 s, 60 s, 120 s ... max 10 min

        } else if(++h.fails >= 3){ h.until = Date.now() + 60e3; h.fails = 0; }   // repeatedly failing: rest for a minute

function categorise(item, stateName){
  const t = item.title, cats = new Set();
  for(const c of CATS){ if((c.re && c.re.test(t)) || (c.cs && c.cs.test(t))) cats.add(c.id); }
  if(stateName){
    const re = new RegExp("\\b(" + stateName.toLowerCase() + (STATE_CITIES[stateName] ? "|"+STATE_CITIES[stateName] : "") + ")\\b", "i");
    if(item.feed==="f-state" || re.test(t)) cats.add("state");

const STOP = new Set("a an the of to in on for and or with at by from as is are was were be been after over amid into its it this that says said new live latest news update updates vs than more his her their will can may how why what who".split(" "));
const NUMWORD = {one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10"};
function features(title){
  const norm = title.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\u0900-\u097f%.₹$ ]+/g," ");
  const words = norm.split(/\s+/).map(w => NUMWORD[w] || w).filter(Boolean);
  const tk = new Set(words.filter(w => w.length>2 && !STOP.has(w)));
  const nums = new Set(words.filter(w => /\d/.test(w)).map(w => w.replace(/[^\d.]/g,"")).filter(Boolean));
  // Entities: capitalised words/sequences in the original headline (people, places, organisations).
  const ents = new Set((title.match(/\b[A-Z][a-zA-Z&.]+(?:\s+[A-Z][a-zA-Z&.]+)*/g) || []).map(e => e.toLowerCase()).filter(e => e.length>2 && !STOP.has(e)));
  return { tk, nums, ents, key: words.join(" ") };
}
function overlap(a, b){ let n = 0; a.forEach(x => { if(b.has(x)) n++; }); return n; }

  if(containment < 0.6 && jaccard < 0.45) return false;
  // Guard against merging different events with similar wording.
  if(A.nums.size && B.nums.size && !overlap(A.nums, B.nums) && containment < 0.85) return false;   // "5 killed" vs "12 killed"
  if(A.ents.size && B.ents.size && !overlap(A.ents, B.ents) && containment < 0.8) return false;    // different people/places

}

    if(!home){ home = { f, lead:it, reports:[], cats:new Set() }; clusters.push(home); }
    cats.forEach(x => home.cats.add(x));
    if(!home.reports.some(r => r.source===it.source)) home.reports.push(Object.assign({ key:f.key }, it));
  }

    const keys = {}; c.reports.forEach(r => keys[r.key] = (keys[r.key]||0)+1);
    const identical = Object.values(keys).filter(n => n>1).reduce((a,n) => a+n, 0);
    const indep = Object.keys(keys).length;          // distinct wordings ≈ independent reporting
    return { id:idx, lead:c.lead, reports:c.reports, outlets:c.reports.length, indep, identical, cats:[...c.cats], ents:c.f.ents, tk:c.f.tk,

function whatHappened(){
  const cs = view.clusters; if(!cs.length) return "";

  let groups;

    const cut = Date.now()-3*3600e3;
    const fresh = view.newLinks ? cs.filter(c => c.reports.some(r => view.newLinks.has(r.link))).sort((a,b) => b.outlets-a.outlets) : [];
    const sinceVisit = view.lastVisit ? take(cs.filter(c => c.first > view.lastVisit).sort((a,b) => b.outlets-a.outlets || b.first-a.first)) : [];
    groups = sinceVisit.length ? [["Since your last visit ("+ago(view.lastVisit)+")", sinceVisit]] : [];
    groups = groups.concat([["New since last refresh", take(fresh)],
              ["New in the last 3 hours", take(cs.filter(c => c.first>=cut).sort((a,b) => b.outlets-a.outlets || b.first-a.first))],
              ["Major updates", take(cs.filter(c => c.outlets>=3 && c.last>=cut && c.first<cut).sort((a,b) => b.outlets-a.outlets))],
              ["Continuing stories", take(cs.filter(c => c.last-c.first >= 6*3600e3).sort((a,b) => b.outlets-a.outlets))]]);
  } else {

}

function catPage(){

    + (shown.length ? '<ul class="feed">'+shown.map(rowHtml).join("")+'</ul>' : '<div class="empty"><b>No stories match.</b>'+(view.src || view.cover!=="all" ? "Try All outlets or All coverage." : "Nothing was reported under this topic on this day.")+'</div>')

// A report counts only if it is on the chosen IST day AND not stamped in the future (bad feed data / clock skew).
const onDayOf = d => x => istDate(new Date(x.ts))===d && x.ts <= Date.now() + 10*60e3;
// Runs feeds tier by tier (core first) with a small worker pool. onFeed fires after every section.
async function runFeeds(feeds, d, signal, onFeed, workers){
  const out = [], failed = [], codes = []; let okCount = 0, stop = false;
  for(const tier of [1, 2]){
    const queue = feeds.filter(f => (f.tier||2)===tier);
    const n = Math.min(queue.length, workers[tier-1]);
    await Promise.all(Array.from({ length:n }, async () => {
      while(queue.length && !signal.aborted && !stop){
        const f = queue.shift();
        try{ const got = parseFeed(await fetchFeed(feedUrl(f, d), signal), f.id); out.push(...got); okCount++; onFeed(f, "ok", got); }
        catch(err){
          if(signal.aborted) return; failed.push(f.id); codes.push(err.code); onFeed(f, "fail");
          if(!okCount && failed.length >= 3) stop = true;       // nothing is getting through: stop early and explain
        }
      }
    }));
    if(signal.aborted) break;
    if(stop) break;
  }
  if(stop) feeds.forEach(f => { if(!failed.includes(f.id) && !out.some(x => x.feed===f.id)){ failed.push(f.id); onFeed(f, "fail"); } });
  return { out, failed, codes, stopped: stop };
}
function applyData(items, failed, at){
  view.items = items; view.failed = failed; view.at = at;
  view.clusters = cluster(items, stateName());
}
async function getNews(opts){
  opts = opts || {};
  const d = opts.date || view.date; if(!d || d > todayIST()) return;
  if(view.ctrl) view.ctrl.abort();
  if(view.prefetchCtrl){ view.prefetchCtrl.abort(); view.prefetchCtrl = null; }
  const token = ++view.token, ctrl = new AbortController(); view.ctrl = ctrl;
  const retryOnly = !!opts.retryFailed && view.failed.length && d===view.date;
  const sameDay = d===view.date;
  if(!sameDay){
    view.limit = 40; view.src = ""; view.pending = null; view.newLinks = null;
    view.lastVisit = store.get("news:lastvisit:"+d);         // when this date was last opened, before we overwrite it
    store.set("news:lastvisit:"+d, Date.now());
  }
  view.date = d; view.empty = null; view.offline = false; remember(d);
  const cached = await packs.get(cacheKey(d));

  // 1. Cache first: anything saved is shown immediately.
  if(cached && !retryOnly && (!sameDay || !view.items.length)){
    applyData(cached.items, cached.failed||[], cached.at); view.loading = false; view.stat = {};
  }
  if(!retryOnly && cached && !opts.force && cacheFresh(cached, d)){ view.refreshing = false; render(); announce(view.clusters.length+" stories"); schedulePrefetch(d, token); return; }

  // 2. Offline: keep whatever is saved on screen.
  if(!navigator.onLine){
    view.refreshing = false; view.loading = false;
    if(cached){ view.offline = true; } else { view.items = []; view.clusters = []; view.empty = { title:"You\u2019re offline.", text:"There\u2019s no saved copy of this day yet. Connect to the internet and it will load automatically." }; }
    render(); return;
  }

  // 3a. Saved copy on screen: refresh silently in the background, offer "N new reports".
  const feeds = retryOnly ? feedsFor().filter(f => view.failed.includes(f.id)) : feedsFor();
  if(cached && !retryOnly){
    view.refreshing = true; render();
    const res = await runFeeds(feeds, d, ctrl.signal, () => {}, [3, 2]);
    if(token!==view.token) return;
    view.refreshing = false;
    const fresh = dedupeReports(res.out.filter(onDayOf(d)));
    if(!fresh.length){ view.note = res.codes.length ? "Couldn\u2019t refresh just now; showing saved news." : ""; render(); schedulePrefetch(d, token); return; }
    const merged = dedupeReports(fresh.concat(view.items));       // never lose a report a failed section had earlier
    const known = new Set(view.items.map(x => x.link));
    const added = merged.filter(x => !known.has(x.link));
    const at = Date.now();
    await packs.set(cacheKey(d), { at, items:merged, failed:res.failed });
    if(added.length && view.items.length){ view.pending = { items:merged, failed:res.failed, at, links:new Set(added.map(x => x.link)) }; view.at = at; render(); showPill(added.length); }
    else { applyData(merged, res.failed, at); render(); }
    schedulePrefetch(d, token); return;
  }

  // 3b. Nothing saved: build progressively, core topics first.
  const stat = {};
  feedsFor().forEach(f => stat[f.id] = { label:f.label, tier:f.tier||2, s: retryOnly && !view.failed.includes(f.id) ? "ok" : "wait" });
  const base = retryOnly ? view.items.slice() : [];
  Object.assign(view, { loading:true, refreshing:false, stat, codes:[] });
  if(!retryOnly){ view.items = []; view.clusters = []; view.failed = []; }
  render();
  const collected = [];
  const res = await runFeeds(feeds, d, ctrl.signal, (f, s, got) => {
    stat[f.id].s = s;
    if(token!==view.token) return;
    if(got && got.length){                 // show each section's stories the moment it arrives
      collected.push(...got);
      view.items = dedupeReports(base.concat(collected.filter(onDayOf(d)))); view.clusters = cluster(view.items, stateName());
    }
    renderSoon();
  }, [3, 2]);
  if(token!==view.token) return;
  clearTimeout(rTimer); rTimer = null;
  const items = dedupeReports(base.concat(collected.filter(onDayOf(d))));
  view.loading = false; view.codes = res.codes;
  applyData(items, retryOnly ? view.failed.filter(id => res.failed.includes(id)) : res.failed, Date.now());
  if(!view.clusters.length){
    const total = feedsFor().length, allFailed = view.failed.length===total, rate = res.codes.some(c => c==="rate");
    view.empty = allFailed
      ? (rate ? { title:"The free news relays are busy right now.", text:"They\u2019re limiting requests from your connection. The app now waits and retries politely; for reliable loading, set up your own free relay (about 2 minutes, no cost).", relay:true }
              : { title:"News couldn\u2019t be reached.", text:"None of the connection routes answered. Check your connection and retry, or set up your own free relay for reliable loading.", relay:true })
      : { title:"No stories found for this date.", text:"The feeds returned nothing published on this IST day. Very old dates may be outside what the source keeps." };
  } else await saveCache(d);
  render();
  if(!view.clusters.length && view.empty && view.empty.relay) setTimeout(runDiag, 50);
  announce(view.clusters.length ? view.items.length+" reports, "+view.clusters.length+" unique stories" : view.empty.title);
  if(view.clusters.length) schedulePrefetch(d, token);
}
// Previous day loads quietly after the current one finishes, so "‹" feels instant. One day only, one request at a time.
function schedulePrefetch(d, token){
  setTimeout(async () => {
    if(token!==view.token || document.visibilityState!=="visible" || !navigator.onLine) return;
    const prev = shiftDay(d, -1), c = await packs.get(cacheKey(prev));
    if(c && cacheFresh(c, prev)) return;
    if(token!==view.token) return;
    const ctrl = new AbortController(); view.prefetchCtrl = ctrl;
    const res = await runFeeds(feedsFor(), prev, ctrl.signal, () => {}, [2, 2]).catch(() => null);
    if(!res || ctrl.signal.aborted) return;
    const items = dedupeReports(res.out.filter(onDayOf(prev)));
    if(items.length) await packs.set(cacheKey(prev), { at:Date.now(), items, failed:res.failed });
    if(view.prefetchCtrl===ctrl) view.prefetchCtrl = null;
  }, 2500);
}

    case "choose": openPop(); break;
    case "nav-search": openSearch(); break;
    case "nav-conn": case "open-conn": openConn(); break;
    case "apply-upd": applyPending(); break;
    case "dismiss-upd": hidePill(); break;
    case "copy-worker": navigator.clipboard && navigator.clipboard.writeText($("worker-code").textContent).then(() => { b.textContent = "Copied"; }).catch(() => {}); break;
    case "relay-save": {
      const v = $("relay-in").value.trim();
      if(!/^https:\/\/[^\s]+$/i.test(v)){ $("relay-msg").textContent = "Enter an https:// address, ending in /?url="; break; }
      store.set("news:relay", v); delete health.custom; saveHealth(); $("relay-msg").textContent = "Saved. Loading news through your relay\u2026";
      setTimeout(() => { closeDetail(); getNews({ force:true }); }, 500); break;
    }
    case "diag-run": runDiag(); break;
    case "diag-copy": navigator.clipboard && navigator.clipboard.writeText(b.dataset.txt||"").then(() => { b.textContent = "Copied \u2014 paste it to me"; }).catch(() => {}); break;
    case "relay-clear": store.del("news:relay"); delete health.custom; saveHealth(); openConn(); break;
    case "more-toggle": $("nav-topics").dataset.more = $("nav-topics").dataset.more==="1" ? "0" : "1"; renderNav(); break;
    case "retry": getNews({ retryFailed:true }); break;
    case "retry-all": getNews({ force:true }); break;
    case "showmore": view.limit += 40; renderContent(); break;
    case "dsave": {
      const c = byId(+ds.id); if(!c) break; let s = store.get("news:saved")||[];
      const i = s.findIndex(x => x.link===c.lead.link);
      if(i>=0) s.splice(i,1); else s.unshift({ title:c.lead.title, link:c.lead.link, source:c.lead.source, ts:c.first, date:view.date });
      store.set("news:saved", s.slice(0,200)); b.setAttribute("aria-pressed", String(i<0)); b.innerHTML = icon("i-bm")+" "+(i<0 ? "Saved" : "Save"); renderNav(); break;
    }
    case "dshare": {
      const c = byId(+ds.id); if(!c) break;
      const text = c.lead.title+" ("+c.lead.source+")";
      (navigator.share ? navigator.share({ title:c.lead.title, text, url:c.lead.link }) : navigator.clipboard.writeText(text+"\n"+c.lead.link).then(() => announce("Link copied")))
        .catch(() => {});
      break;
    }
  }
});
$("layer").addEventListener("input", e => { if(e.target.id==="cmdq") searchResults(e.target.value); });
function addWatch(t){ t = String(t).trim().slice(0,40); if(!t) return; const w = store.get("news:watch")||[]; if(!w.some(x => x.toLowerCase()===t.toLowerCase())) w.push(t); store.set("news:watch", w.slice(0,12)); renderContent(); }
document.addEventListener("submit", e => { if(e.target.id==="wl-form"){ e.preventDefault(); addWatch($("wl-in").value); const i = $("wl-in"); if(i) i.focus(); } });
document.addEventListener("change", e => { if(e.target.id==="srcf"){ view.src = e.target.value; view.limit = 40; renderContent(); const s = $("srcf"); if(s) s.focus(); } });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==="/" && !typing && !$("cmdwrap")){ e.preventDefault(); openSearch(); return; }
  if(e.key==="Escape"){ if($("cmdwrap")) closeSearch(); else if(document.querySelector(".drawer")) closeDetail(); else if(!$("pop").hidden) closePop(); else closeNav(); return; }
  if($("cmdwrap") && ["ArrowDown","ArrowUp","Enter"].includes(e.key)){
    const opts = [...document.querySelectorAll("#cmdres [role=option]")]; if(!opts.length) return;
    if(e.key==="Enter"){ e.preventDefault(); opts[cmdSel].click(); return; }
    e.preventDefault(); cmdSel = (cmdSel + (e.key==="ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("on", i===cmdSel)); opts[cmdSel].scrollIntoView({block:"nearest"});
  }
});
// Today only: refresh quietly every 10 minutes while visible.
setInterval(() => { if(document.visibilityState==="visible" && isToday() && !view.loading && !view.refreshing && !view.pending && view.at && Date.now()-view.at > 10*60e3) getNews({ force:true }); }, 60e3);
window.addEventListener("online", () => { if(view.date && (view.empty || view.offline)) getNews({ force:true }); });
window.addEventListener("offline", () => { if(view.items.length){ view.offline = true; renderHeader(); } });

// Back/forward and edited addresses move between days too.
window.addEventListener("hashchange", () => {
  const h = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(x => x.split("=")));
  if(h.d && /^\d{4}-\d{2}-\d{2}$/.test(h.d)){ const d = h.d > todayIST() ? todayIST() : h.d; if(d!==view.date) getNews({ date:d }); }
});
// Restore from the address (#d=YYYY-MM-DD&p=page&c=cat) so refresh keeps your place.
(async function init(){
  perf.mark("shell");
  const h = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(x => x.split("=")));
  if(h.p && ["home","topics","cat","timeline","archive","saved"].includes(h.p)) view.page = h.p;
  if(h.c && CAT_BY_ID[h.c]) view.cat = h.c;
  await packs.init();
  perf.mark("cacheReady");
  render();
  const start = h.d && /^\d{4}-\d{2}-\d{2}$/.test(h.d) ? (h.d > todayIST() ? todayIST() : h.d) : todayIST();
  await getNews({ date: start });
  perf.mark("firstLoad");
})();

</script>
